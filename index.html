            font-family: 'Poppins', sans-serif;

        .container {

        .section-title {

            font-weight: 600;
            color: var(--primary-emerald);
            margin-bottom: 0.5rem;
        }

        .form-group select, .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--gray-border);
            border-radius: 6px;
            font-size: 1rem;
        }

        .quote-result {
            display: none;
            background: var(--primary-emerald);
            color: var(--white);
            padding: 1.5rem;
            border-radius: 8px;

        .quote-result h3 {

        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .price-card {
            background: var(--light-bg);
            border: 1px solid var(--gray-border);
            border-top: 5px solid var(--primary-emerald);
            padding: 1.8rem;
            border-radius: 8px;
            text-align: center;
            transition: 0.3s;
        }

        .price-card.popular {
            border-top-color: var(--accent-gold);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
        }

        .price-card h3 {
            color: var(--primary-emerald);
            font-size: 1.4rem;
        }

        .price-card .price {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-emerald);
            margin: 1rem 0;
        }

        .price-card ul {
            list-style: none;
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .price-card ul li {
            padding: 0.4rem 0;
            border-bottom: 1px dashed var(--gray-border);
            font-size: 0.95rem;
        }

        .price-card ul li i {
            color: var(--accent-gold);
            margin-right: 8px;
        }
